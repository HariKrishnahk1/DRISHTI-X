version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: drishti_db
    environment:
      POSTGRES_USER: drishti
      POSTGRES_PASSWORD: secure_defence_password_123
      POSTGRES_DB: drishtix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drishti -d drishtix"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: drishti_backend
    environment:
      - DATABASE_URL=postgresql://drishti:secure_defence_password_123@db:5432/drishtix
      - SECRET_KEY=defence-grade-drishti-x-cryptographic-signing-key-32bytes-min
      - AIR_GAPPED_MODE=true
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: drishti_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
